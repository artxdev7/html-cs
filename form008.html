<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>formulario</title>
</head>

<body>
    <h1>teste de formulário</h1>
    <form action="cadastro.php" method="post" autocomplete="on">
        <fieldset>
            <legend></legend>

            <p>
                <label for="num">Numero 1:</label>
                <input type="number" name="num" id="num" min="0" max="10" required
                    oninput="soma.innerHTML = Number (num.value) + Number(num2.value)">
                <br>
                <label for="num2">Numero 2</label>
                <input type="number" name="num2" id="num2" min="0" max="10" required
                    oninput="soma.innerHTML = Number (num.value) + Number(num2.value)">
            </p>

            <p>
                <label for="soma">Soma:</label>
                <output id="soma" name="soma">0</output>
            </p>
        </fieldset>
        <p>
            <input type="submit">
            <input type="reset">
        </p>
    </form>
</body>

</html>
