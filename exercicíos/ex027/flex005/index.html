<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flex</title>
    <style>
        * {
            margin: 0%;
            padding: 0%;
            box-sizing: border-box;
        }

        body {
            background-color: lightsalmon;
        }

        main {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-flow: row nowrap;
            background-color: lightgreen;
            height: 100vh;
            width: 100vw;
        }

        section {
            background-color: aqua;

            width: 200px;
            height: 200px;
        }
    </style>
</head>

<body>
    <main>
        <section>
            <h1>tela de login</h1>
        </section>
    </main>
</body>

</html>
