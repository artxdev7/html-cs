<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>grid</title>
    <style>
        .container {
            border: 3px solid red;
            height: 250px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 5px;
        }

        .item {
            border: 2px solid blue;
            padding: 5px;
            background-color: rgba(0, 0, 255, 0.329);
            text-align: center;
        }

        #a {
            grid-column: span 4;
        }

        #b {
            grid-area: 2 / 1 / span 4 / -3;
        }

        #c {
            grid-area: 2 / 3 /span 4 / -1;
        }
    </style>
</head>

<body>
    <div class="container">
        <div id="a" class="item">A</div>
        <div id="b" class="item">B</div>
        <div id="c" class="item">C</div>
    </div>
</body>

</html>
