<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>

<body>
    <h1>teste de formulário</h1>
    <form action="cadastro.php" method="post" autocomplete="on">
        <p><label for="nome">nome:</label>
            <input type="text" name="nome" id="nome" required minlength="5" maxlength="20" placeholder="Digite seu nome"
                autocomplete="name">
        </p>
        <p>
            <label for="media">media:</label>
            <input type="number" name="media" id="media" required min="0" max="10" step="0.1" placeholder="0 a 10">
        </p>
        <p>
            <label for="mes">periodo eletivo:</label>
            <input type="month" name="mes" id="mes" required>
        </p>
        <p>
            <label for="hora">hora da prova:</label>
            <input type="time" name="hora" id="hora" required>
        </p>
        <p>
            <label for="dia">dia da prova:</label>
            <input type="date" name="dia" id="dia" required>
        </p>
        <p>
            <input type="submit">
            <input type="reset">
        </p>
    </form>
</body>

</html>
