<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>desafio grid</title>
    <style>
        * {
            margin: 0%;
            padding: 0%;
        }

        body {
            display: grid;
            grid-template: repeat(10, 1fr) / repeat(7, 1fr);
            grid-auto-rows: 1fr;
            grid-auto-columns: 1fr;
            height: 100vh;
            gap: 5px;


        }

        p {
            text-align: center;
        }

        header {
            display: grid;
            background-color: rgba(0, 0, 255, 0.388);
            grid-area: 1 / 1 / 1 / -1;
        }

        nav {
            background-color: rgb(255, 122, 144);
            grid-area: 2 / 1 / 3 / -1;
        }

        main {
            background-color: rgba(255, 0, 0, 0.358);
            grid-area: 3 / 1 / -2 / -2;
        }

        aside {
            background-color: rgba(0, 128, 0, 0.338);
            grid-area: 3 / -2 / -2 / -1;
        }

        footer {
            background-color: rgba(255, 255, 0, 0.379);
            grid-area: 10 / 1 / -1 / -1;
        }
    </style>
</head>

<body>
    <header>
        <p>TOPO</p>
    </header>
    <nav>
        <p>menu</p>
    </nav>
    <main>
        <P>CONTEUDO</P>
    </main>
    <aside>
        <P>ANUNCIO</P>
    </aside>
    <footer>
        <P>RODAPE</P>
    </footer>
</body>

</html>
